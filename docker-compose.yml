
services:
  backend:
    build:
      context: ./edtech-backend
    container_name: edtech-backend 
    ports:
      - "5000:5000"
    env_file:
      - ./edtech-backend/.env
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
    volumes:
      - ./edtech-backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./edtech-frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: edtech-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
